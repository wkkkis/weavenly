name: Site refresh

# Asks Vercel for a fresh production build of weavenly.app once a day, so the /h1b pages carry the newest H-1B data
# and today's open jobs from the job index, and /hiring-report the newest week (all read at build time;
# hiring-report.yml also asks for a build after it publishes a week). It needs the VERCEL_DEPLOY_HOOK secret
# (Vercel → the site's project → Settings → Git → Deploy Hooks, branch main); without it the run does nothing.

on:
  schedule:
    - cron: '25 10 * * *'
  workflow_dispatch:

jobs:
  hook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Vercel to build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK is not set; nothing to do"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "build requested"
