name: Job index

# Builds the public job index every 4 hours and publishes it to R2 (served at https://index.weavenly.app/v1/).
# The first run on a Monday (UTC) is the weekly one: it also looks for new boards and checks cold and dead boards.
# A run takes about 28 minutes; GitHub often starts a scheduled run hours late, and the next one follows it
# (one at a time, never cancelled).

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Run the weekly pass (new boards, cold and dead boards)'
        type: boolean
        default: false

concurrency:
  group: job-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Build and publish
        env:
          # The index has its own bucket and its own key; the R2_* secrets without the prefix belong to
          # release.yml's downloads bucket. Only the account id is shared.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.INDEX_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.INDEX_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.INDEX_R2_BUCKET }}
          INDEX_URL: https://index.weavenly.app/v1
          # the last index and this run's jobs are in memory at once; Node's default of 4 GB stopped both runs
          # of 2026-11-03 (29 147 boards read)
          NODE_OPTIONS: --max-old-space-size=6144
        # The first run on a Monday (UTC) is the weekly one: it also finds new boards and rechecks cold and
        # dead ones (isWeeklyRun in the builder decides by the published index's date, so a late start still
        # counts and the next Monday run is an ordinary one).
        run: npm --workspace backend run index:build -- --publish ${{ inputs.weekly == true && '--weekly' || '--auto-weekly' }}
